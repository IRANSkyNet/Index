<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyNet | Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Estedad',sans-serif;
    background:#050816;
    color:white;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Background */

.bg{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.5;
    animation:float 10s ease-in-out infinite;
}

.circle1{
    width:400px;
    height:400px;
    background:#2563eb;
    top:-120px;
    right:-120px;
}

.circle2{
    width:350px;
    height:350px;
    background:#7c3aed;
    bottom:-100px;
    left:-100px;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(30px);
    }
}

/* Back Button */

.back-btn{
    position:absolute;
    top:25px;
    left:25px;
    z-index:100;
    width:50px;
    height:50px;
    border-radius:16px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:white;
    font-size:22px;
    transition:0.3s;
}

.back-btn:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,0.1);
    color:#93c5fd;
    box-shadow:0 0 20px rgba(59,130,246,0.3);
}

/* Main Box */

.container{
    position:relative;
    z-index:10;
    width:90%;
    max-width:950px;
    padding:60px 40px;
    border-radius:35px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(16px);
    text-align:center;
    box-shadow:0 0 50px rgba(0,0,0,0.4);
}

/* Logo */

.logo{
    font-size:64px;
    font-weight:700;
    margin-bottom:18px;
    background:linear-gradient(90deg,#60a5fa,#a78bfa);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* Text */

.text{
    font-size:18px;
    line-height:2;
    color:#cbd5e1;
    margin-bottom:50px;
}

/* Countdown */

.countdown{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
}

.box{
    width:150px;
    height:150px;
    border-radius:28px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:0.3s;
}

.box:hover{
    transform:translateY(-8px);
    background:rgba(255,255,255,0.08);
}

.label{
    position:absolute;
    top:18px;
    font-size:15px;
    color:#94a3b8;
}

.number{
    font-size:52px;
    font-weight:700;
    margin-top:15px;
}

/* Footer */

.footer{
    margin-top:45px;
    color:#64748b;
    font-size:14px;
}

/* Responsive */

@media(max-width:768px){

    .container{
        padding:45px 20px;
    }

    .logo{
        font-size:44px;
    }

    .text{
        font-size:16px;
    }

    .box{
        width:120px;
        height:120px;
    }

    .number{
        font-size:40px;
    }
}

</style>
</head>

<body>

<div class="bg">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
</div>

<a href="/" class="back-btn">
    ←
</a>

<div class="container">

    <h1 class="logo">SkyNet</h1>

    <p class="text">
        این صفحه در حال طراحی و توسعه می‌باشد<br>
        به‌زودی با امکانات جدید در دسترس قرار خواهد گرفت
    </p>

    <div class="countdown">

        <div class="box">
            <div class="label">روز</div>
            <div class="number" id="days">200</div>
        </div>

        <div class="box">
            <div class="label">ساعت</div>
            <div class="number" id="hours">10</div>
        </div>

        <div class="box">
            <div class="label">دقیقه</div>
            <div class="number" id="minutes">00</div>
        </div>

        <div class="box">
            <div class="label">ثانیه</div>
            <div class="number" id="seconds">00</div>
        </div>

    </div>

    <div class="footer">
        © 2026 SkyNet Project — All Rights Reserved
    </div>

</div>

<script>

/*
    تاریخ نهایی شمارش معکوس
    این مقدار را تغییر بده
*/

const targetDate = new Date("2026-12-31T23:59:59").getTime();

/*
    بروزرسانی زمان
*/

function updateCountdown(){

    const now = new Date().getTime();

    const distance = targetDate - now;

    if(distance <= 0){

        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";

        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));

    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60))
        / 1000
    );

    document.getElementById("days").innerHTML =
        String(days).padStart(2,'0');

    document.getElementById("hours").innerHTML =
        String(hours).padStart(2,'0');

    document.getElementById("minutes").innerHTML =
        String(minutes).padStart(2,'0');

    document.getElementById("seconds").innerHTML =
        String(seconds).padStart(2,'0');
}

updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
</html>
