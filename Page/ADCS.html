<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyNet | Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Estedad',sans-serif;
    background:#f8fafc;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#0f172a;
}

/* جلوگیری از نمایش اولیه اشتباه */
.container{
    opacity:0;
    transition:opacity 0.3s ease;
}

/* background */
.bg{
    position:absolute;
    inset:0;
}

.circle{
    position:absolute;
    filter:blur(120px);
    opacity:.35;
    border-radius:50%;
    animation:float 10s infinite ease-in-out;
}

.circle1{width:420px;height:420px;background:#60a5fa;top:-120px;right:-120px;}
.circle2{width:360px;height:360px;background:#c084fc;bottom:-120px;left:-120px;}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(25px)}
}

/* back button */
.back-btn{
    position:absolute;
    top:25px;
    left:25px;
    width:55px;height:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:18px;
    background:rgba(255,255,255,.75);
    text-decoration:none;
    color:#0f172a;
    font-size:24px;
    z-index:100;
}

/* container */
.container{
    position:relative;
    z-index:10;
    width:90%;
    max-width:960px;
    padding:60px 40px;
    border-radius:38px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(18px);
    text-align:center;
}

/* text */
.logo{
    font-size:68px;
    font-weight:700;
    background:linear-gradient(90deg,#2563eb,#9333ea);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.text{
    margin:20px 0 50px;
    color:#475569;
    line-height:2;
}

/* boxes */
.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.box{
    width:150px;
    height:150px;
    background:white;
    border-radius:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.label{
    position:absolute;
    top:18px;
    font-size:14px;
    color:#64748b;
}

.number{
    font-size:54px;
    font-weight:700;
}

</style>
</head>

<body>

<div class="bg">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
</div>

<a class="back-btn" href="https://6a08116a8465b.mywebzi.ir/">←</a>

<div class="container" id="container">

    <h1 class="logo">SkyNet</h1>

    <p class="text">
        این صفحه در حال طراحی و توسعه می‌باشد
    </p>

    <div class="countdown">

        <div class="box">
            <div class="label">روز</div>
            <div class="number" id="days">--</div>
        </div>

        <div class="box">
            <div class="label">ساعت</div>
            <div class="number" id="hours">--</div>
        </div>

        <div class="box">
            <div class="label">دقیقه</div>
            <div class="number" id="minutes">--</div>
        </div>

        <div class="box">
            <div class="label">ثانیه</div>
            <div class="number" id="seconds">--</div>
        </div>

    </div>

</div>

<script>

/* هدف */
const targetDate = new Date(2026, 08, 25, 23, 59, 59).getTime();

function updateCountdown(){

    const now = Date.now();
    const diff = targetDate - now;

    if(diff <= 0){
        setValues(0,0,0,0);
        return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    setValues(days,hours,minutes,seconds);
}

function setValues(d,h,m,s){
    document.getElementById("days").textContent = String(d).padStart(2,'0');
    document.getElementById("hours").textContent = String(h).padStart(2,'0');
    document.getElementById("minutes").textContent = String(m).padStart(2,'0');
    document.getElementById("seconds").textContent = String(s).padStart(2,'0');
}

/* مهم: قبل از نمایش کامل */
updateCountdown();

/* بعد از آماده شدن صفحه */
window.addEventListener("load", () => {
    updateCountdown();
    document.getElementById("container").style.opacity = 1;
});

/* آپدیت زنده */
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
