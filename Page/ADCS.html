<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SkyNet - Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Estedad',sans-serif;
    height:100vh;
    overflow:hidden;
    background:#050816;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Background Glow */
body::before{
    content:'';
    position:absolute;
    width:700px;
    height:700px;
    background:radial-gradient(circle,#3b82f655 0%,transparent 70%);
    top:-200px;
    right:-200px;
    animation:float 8s ease-in-out infinite;
}

body::after{
    content:'';
    position:absolute;
    width:600px;
    height:600px;
    background:radial-gradient(circle,#8b5cf655 0%,transparent 70%);
    bottom:-250px;
    left:-200px;
    animation:float2 10s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(30px);}
}

@keyframes float2{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-25px);}
}

.container{
    position:relative;
    z-index:10;
    width:90%;
    max-width:900px;
    text-align:center;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:60px 40px;
    box-shadow:0 0 50px rgba(0,0,0,0.4);
}

.logo{
    font-size:52px;
    font-weight:700;
    margin-bottom:10px;
    background:linear-gradient(90deg,#60a5fa,#a78bfa);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:#cbd5e1;
    font-size:18px;
    margin-bottom:40px;
    line-height:1.9;
}

.status{
    display:inline-block;
    padding:10px 22px;
    border-radius:50px;
    background:rgba(59,130,246,0.15);
    border:1px solid rgba(59,130,246,0.4);
    color:#93c5fd;
    margin-bottom:35px;
    font-size:14px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.time-box{
    width:140px;
    height:140px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:0.3s;
}

.time-box:hover{
    transform:translateY(-8px);
    background:rgba(255,255,255,0.08);
}

.number{
    font-size:48px;
    font-weight:700;
    color:#fff;
}

.label{
    margin-top:10px;
    color:#94a3b8;
    font-size:14px;
}

.footer{
    margin-top:40px;
    color:#64748b;
    font-size:14px;
}

.progress{
    width:100%;
    height:8px;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    margin-top:40px;
    overflow:hidden;
}

.progress-bar{
    width:65%;
    height:100%;
    background:linear-gradient(90deg,#3b82f6,#8b5cf6);
    border-radius:20px;
    animation:progressAnim 3s ease-in-out infinite;
}

@keyframes progressAnim{
    0%{width:40%;}
    50%{width:75%;}
    100%{width:40%;}
}

@media(max-width:768px){

    .container{
        padding:40px 20px;
    }

    .logo{
        font-size:38px;
    }

    .time-box{
        width:110px;
        height:110px;
    }

    .number{
        font-size:36px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="status">
        🚀 صفحه در حال توسعه است
    </div>

    <h1 class="logo">SkyNet</h1>

    <p class="subtitle">
        ما در حال ساخت یک تجربه حرفه‌ای و متفاوت هستیم.<br>
        این صفحه به‌زودی در دسترس قرار خواهد گرفت.
    </p>

    <div class="countdown">

        <div class="time-box">
            <div class="number" id="days">90</div>
            <div class="label">روز</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">14</div>
            <div class="label">ساعت</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">15</div>
            <div class="label">دقیقه</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">ثانیه</div>
        </div>

    </div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="footer">
        © 2026 SkyNet Project — All Rights Reserved
    </div>

</div>

<script>

/*
    زمان نهایی:
    این تاریخ را تغییر بده
*/

const targetDate = new Date("2026-12-31T23:59:59").getTime();

/*
    ذخیره اولین ورود کاربر
    تا با رفرش صفحه زمان از اول شروع نشود
*/

if(!localStorage.getItem("firstVisit")){
    localStorage.setItem("firstVisit", Date.now());
}

function updateCountdown(){

    const now = new Date().getTime();

    const distance = targetDate - now;

    if(distance <= 0){

        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";

        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));

    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60))
        / 1000
    );

    document.getElementById("days").innerHTML =
        String(days).padStart(2,'0');

    document.getElementById("hours").innerHTML =
        String(hours).padStart(2,'0');

    document.getElementById("minutes").innerHTML =
        String(minutes).padStart(2,'0');

    document.getElementById("seconds").innerHTML =
        String(seconds).padStart(2,'0');
}

setInterval(updateCountdown,1000);

updateCountdown();

</script>

</body>
</html>
